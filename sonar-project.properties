sonar.projectKey=synapse
sonar.projectName=Synapse
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,backend/scripts,frontend/src
sonar.tests=backend/tests

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/src/**

sonar.exclusions=**/.env,**/.env.*,**/*.env,**/node_modules/**,**/dist/**,**/coverage/**,**/.scannerwork/**,security/zap/reports/**,frontend/nginx.conf

sonar.scm.disabled=false
