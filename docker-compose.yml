# ============================================================
#  SYNAPSE - Orquestación local (Docker Compose)
#  NOTA: esta compose levanta su propio servidor MySQL en el
#  puerto 3307 para no chocar con tu MySQL local (3306).
#  Si prefieres usar tu MySQL local, comenta el servicio "mysql"
#  y apunta DB_HOST a host.docker.internal.
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-secret}
      DB_NAME: ${DB_NAME:-synapse}
      DB_NAME_TEST: synapse_test
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: synapse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-secret}
      MYSQL_DATABASE: ${DB_NAME:-synapse}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/synapse.sql:/docker-entrypoint-initdb.d/synapse.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: